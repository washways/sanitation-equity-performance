name: Update static data snapshot

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/snapshot.json"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  update-data:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build snapshot
        run: python scripts/update_snapshot.py
      - name: Commit changed snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/snapshot.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          git commit -m "Update static data snapshot"
          git push
